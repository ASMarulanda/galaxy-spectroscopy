name: tests

# Two kinds of test live in this repository, and CI runs exactly one kind.
#
#   portable        — true on any machine: the FITS contract, the conversion that
#                     preserves columns bit for bit, provenance, accuracy against
#                     analytic truth within the acceptance floors, flags, the
#                     covariance *rule*, failure handling, scientific invariants.
#                     Tolerances are chosen from measurement (tests/test_regression.py
#                     documents each one) and sit 10x-1000x below the size of a real
#                     scientific change.
#
#   characterisation — pins the golden baseline to its printed digits. True on the
#                     stack the numbers were produced on and nowhere else: the fitted
#                     numbers are not bit-reproducible across BLAS builds, and on
#                     bound-pinned rows sigma moves by a factor of several
#                     (docs/limitations.md L17). Run them locally with:
#
#                         pytest -m characterisation
#
# The suite is offline: the network is replaced by fakes in tests/test_fetch.py, and
# the end-to-end test serves bytes from a local fixture. Nothing here downloads SDSS
# data, and no secret is used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pins live in pyproject.toml — numpy 1.26.4, scipy 1.11.4, astropy 7.0.0,
      # matplotlib 3.6.3 — so CI installs exactly the stack the numbers were produced on.
      - name: Install the validated environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Imports resolve
        run: |
          python -c "import sys, gspec, numpy, scipy, astropy, matplotlib; \
          print('python', sys.version.split()[0]); \
          print('gspec', gspec.__version__); \
          print('numpy', numpy.__version__); \
          print('scipy', scipy.__version__); \
          print('astropy', astropy.__version__)"

      - name: Portable scientific verification
        run: pytest -m "not characterisation" -q

      - name: Deselected reference-environment tests
        # Printed so the gap between what CI runs and what exists is never invisible.
        run: |
          echo "characterisation tests kept out of CI:"
          pytest -m characterisation --collect-only -q | tail -3

      - name: Baseline fingerprint — reported, not asserted
        # The exact hash is a statement about this runner's BLAS build, so it is
        # printed for the record instead of failing the build. What must hold
        # everywhere is asserted by test_portable_baseline_regression.
        run: |
          gspec measure --cases data/cases --out /tmp/baseline.csv --quiet
          python -c "import hashlib; \
          g = hashlib.sha256(open('/tmp/baseline.csv','rb').read()).hexdigest(); \
          ref = '460913a261a8ebecd88b89d63266c87d0f1ad906c71ff2fa8907d4fb76a2211d'; \
          print('measured :', g); \
          print('reference:', ref); \
          print('identical' if g == ref else 'differs — expected on a different BLAS build; see docs/limitations.md L17')"
