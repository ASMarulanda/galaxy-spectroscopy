[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gspec"
version = "0.1.0"
description = "Redshift estimation and emission-line analysis of optical galaxy spectra"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ana Sofia Marulanda-Duque" }]
keywords = ["astronomy", "astrophysics", "spectroscopy", "sdss", "emission-lines", "galaxies"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]

# The pins are part of the science, not housekeeping: every number in
# docs/methods.md and validation/report.md was calibrated against these versions.
# See docs/limitations.md, "environment sensitivity", before changing any of them.
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "astropy==7.0.0",
  "astropy-iers-data==0.2024.12.2.0.35.34",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "matplotlib==3.6.3"]
ml = ["scikit-learn==1.4.2"]

[project.scripts]
gspec = "gspec.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gspec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than ~10 s (the full 20-case fit)",
  "experiment: a controlled experiment, not part of the default pipeline",
  "characterisation: pins a measured value, so a change is a change in the science",
]
